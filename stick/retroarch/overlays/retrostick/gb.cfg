# RetroStick frame for gb: the console around the game (overlay 0) and nothing (overlay 1).
# Touchpad click (input_overlay_next) switches between them. PNG: 1920x1080 with a transparent hole
# exactly where the per-console override puts the game (custom viewport). Made with docs/maquetas/marcos.html.
overlays = 2
overlay0_name = "marco"
overlay0_overlay = "gb.png"
overlay0_full_screen = true
overlay0_normalized = true
overlay0_descs = 0
overlay1_name = "sin marco"
overlay1_overlay = "empty.png"
overlay1_full_screen = true
overlay1_normalized = true
overlay1_descs = 0
