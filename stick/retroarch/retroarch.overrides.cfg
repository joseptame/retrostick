# RetroStick: keys merged into the stick's retroarch.cfg by install.ps1 / install.sh.
# Verified against RetroArch 1.22.2 (com.retroarch.ra32): every key exists in the generated cfg.
# Target: /storage/emulated/0/Android/data/com.retroarch.ra32/files/retroarch.cfg

# Directories (saves outside /ROMs so FolderSync mirror mode never deletes them)
savefile_directory = "/storage/emulated/0/Partidas/saves"
savestate_directory = "/storage/emulated/0/Partidas/states"
system_directory = "/storage/emulated/0/RetroArch/system"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
# Defaults point to /data/user/0/... (not writable over ADB); moved to shared storage
joypad_autoconfig_dir = "/storage/emulated/0/RetroArch/autoconfig"
overlay_directory = "/storage/emulated/0/RetroArch/overlays"

# Saving
savestate_auto_save = "true"
# Games start from the title screen; the launcher turns it on for «Continuar…» in Detalles
savestate_auto_load = "false"
state_slot = "0"

# Shortcuts (DualSense codes on Android 9): hold Create + L1 = quick save, + R1 = load it, + R2 = fast-forward.
# The launcher writes them again before each game.
input_enable_hotkey_btn = "104"
input_save_state_btn = "100"
input_load_state_btn = "101"
input_toggle_fast_forward_btn = "103"
autosave_interval = "10"
savestate_thumbnail_enable = "false"

# Video (Mali-450 / GLES2)
video_driver = "gl"
video_threaded = "true"
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "true"
video_shader_enable = "false"

# Audio
audio_latency = "96"

# Performance
rewind_enable = "false"
run_ahead_enabled = "false"

# Menu and input
menu_driver = "ozone"
# 4 = INPUT_COMBO_START_SELECT (input/input_defines.h, v1.22.2)
input_menu_toggle_gamepad_combo = "4"
input_autodetect_enable = "true"
pause_nonactive = "true"
# "Close content" quits RetroArch, so Android returns to the RetroStick launcher
# (1 = QUIT_ON_CLOSE_CONTENT_ENABLED, menu/menu_defines.h, v1.22.2)
quit_on_close_content = "1"
# Keep the repo config, remaps and core overrides from being overwritten on exit
config_save_on_exit = "false"
remap_save_on_exit = "false"

# Clean game start (the launcher writes these again before each game): no loading band, no RetroAchievements
# summary / login / "not identified" messages, no remap / override / controller notices. Unlocks and quick
# save / load notices still show.
menu_show_load_content_animation = "false"
cheevos_visibility_summary = "2"
cheevos_visibility_account = "false"
cheevos_verbose_enable = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_autoconfig = "false"
notification_show_set_initial_disk = "false"
