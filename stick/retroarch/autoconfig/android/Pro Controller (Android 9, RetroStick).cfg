# Nintendo Switch Pro Controller on Android 9 (Xiaomi Mi TV Stick), Bluetooth.
# Like the DualSense, Generic.kl maps its raw HID buttons in HID order. Measured with `getevent -lt` on
# 2026-11-09 (docs/mandos.md):
#   A=96 B=97 X=98 Y=99 L=100 R=101 ZL=102 ZR=103 -=104 +=105 Capture=106 L3=109 R3=108 Home=110
# Same codes as the DualSense except the face buttons. Played like the PlayStation pad (user's choice):
#   A = Cross, B = Circle, Y = Square, X = Triangle; L/R = L1/R1, ZL/ZR = L2/R2, - = Create, + = Options,
#   Home = PS (RetroArch menu), Capture = touchpad (frame on/off).
# The official "Pro Controller.cfg" assumes Android 11+ codes (X would be L): install.ps1 disables it.
input_driver = "android"
input_device = "Pro Controller"
input_device_display_name = "Pro Controller (Android 9, RetroStick)"
input_vendor_id = "1406"
input_product_id = "8201"

# RetroPad as the PlayStation pad: B (Cross) = A, A (Circle) = B, Y (Square) = Y, X (Triangle) = X
input_b_btn = "96"
input_a_btn = "97"
input_y_btn = "99"
input_x_btn = "98"
input_l_btn = "100"
input_r_btn = "101"
input_l2_btn = "102"
input_r2_btn = "103"
input_select_btn = "104"
input_start_btn = "105"
input_l3_btn = "109"
input_r3_btn = "108"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# Home opens the RetroArch menu (shortcuts with -: retroarch.cfg, docs/mandos.md).
input_menu_toggle_btn = "110"

input_b_btn_label = "A"
input_a_btn_label = "B"
input_y_btn_label = "Y"
input_x_btn_label = "X"
input_l_btn_label = "L"
input_r_btn_label = "R"
input_l2_btn_label = "ZL"
input_r2_btn_label = "ZR"
input_select_btn_label = "Minus"
input_start_btn_label = "Plus"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_l_x_plus_axis_label = "Left Analog X+ (Right)"
input_l_x_minus_axis_label = "Left Analog X- (Left)"
input_l_y_plus_axis_label = "Left Analog Y+ (Down)"
input_l_y_minus_axis_label = "Left Analog Y- (Up)"
input_r_x_plus_axis_label = "Right Analog X+ (Right)"
input_r_x_minus_axis_label = "Right Analog X- (Left)"
input_r_y_plus_axis_label = "Right Analog Y+ (Down)"
input_r_y_minus_axis_label = "Right Analog Y- (Up)"
input_menu_toggle_btn_label = "Home"
