# DualSense on Android 9 (Xiaomi Mi TV Stick), Bluetooth.
# Android 9 has no key layout for 054c:0ce6, so Generic.kl maps the raw HID buttons in their HID order.
# Measured with `getevent -lt` on 2026-11-03 (docs/mandos.md):
#   Square=96 Cross=97 Circle=98 Triangle=99 L1=100 R1=101 L2=102 R2=103
#   Create=104 Options=105 L3=109 R3=108 PS=110 Touchpad=106
# The official "DualSense Wireless Controller (Android 1x).cfg" files assume the Android 11+ layout and match
# the same name/vid/pid, so install.ps1 moves them to autoconfig/disabled/.
input_driver = "android"
input_device = "DualSense Wireless Controller"
input_device_display_name = "DualSense (Android 9, RetroStick)"
input_vendor_id = "1356"
input_product_id = "3302"

# RetroPad: B = bottom (Cross), A = right (Circle), Y = left (Square), X = top (Triangle)
input_b_btn = "97"
input_a_btn = "98"
input_y_btn = "96"
input_x_btn = "99"
input_l_btn = "100"
input_r_btn = "101"
input_l2_btn = "102"
input_r2_btn = "103"
input_select_btn = "104"
input_start_btn = "105"
input_l3_btn = "109"
input_r3_btn = "108"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# PS opens the RetroArch menu. Quick save / fast-forward are per core (overrides/Gambatte/Gambatte.cfg),
# because on GBA L1/R1 are game buttons.
input_menu_toggle_btn = "110"

input_b_btn_label = "Cross"
input_a_btn_label = "Circle"
input_y_btn_label = "Square"
input_x_btn_label = "Triangle"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_select_btn_label = "Create"
input_start_btn_label = "Options"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_l_x_plus_axis_label = "Left Analog X+ (Right)"
input_l_x_minus_axis_label = "Left Analog X- (Left)"
input_l_y_plus_axis_label = "Left Analog Y+ (Down)"
input_l_y_minus_axis_label = "Left Analog Y- (Up)"
input_r_x_plus_axis_label = "Right Analog X+ (Right)"
input_r_x_minus_axis_label = "Right Analog X- (Left)"
input_r_y_plus_axis_label = "Right Analog Y+ (Down)"
input_r_y_minus_axis_label = "Right Analog Y- (Up)"
input_menu_toggle_btn_label = "PS"
