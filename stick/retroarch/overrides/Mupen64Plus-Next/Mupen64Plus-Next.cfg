# Core override for Mupen64Plus-Next (Nintendo 64, GLES2 build), loaded automatically (auto_overrides_enable).
# Installed to /storage/emulated/0/RetroArch/config/Mupen64Plus-Next/Mupen64Plus-Next.cfg
# Fast-forward at x2. The shortcuts (Create + L1 / R1 / R2) are the same on every console: retroarch.cfg,
# written by the launcher before each game (see docs/mandos.md).
# Buttons: remaps/Mupen64Plus-Next/Mupen64Plus-Next.rmp (Pro Controller A = A, B = B; DualSense Cross = A,
# Circle = B), L2 = Z, L1 / R1 = L / R, right stick = C buttons, left stick = the analog stick, Options / + = Start.
# Speed (core-options/Mupen64Plus-Next/Mupen64Plus-Next.opt, tested 2026-11-11): the threaded renderer is what
# reaches full speed on the S805Y (Mario Kart 64 60/60 even split-screen, Super Mario 64 50/50; ~45 without it);
# framebuffer emulation stays on (off leaves a garbage band at the bottom of PAL games).
fastforward_ratio = "2.000000"
