# Content-directory override: games in /ROMs/neogeo (RetroArch loads config/<Core>/<folder name>.cfg after
# the core's own <Core>.cfg). Installed to "/storage/emulated/0/RetroArch/config/FinalBurn Neo/neogeo.cfg"
# Fixed game size (full height, 4:3), 1440x1080 centred (RetroArch 1.22 centres the custom viewport: x/y are offsets from the centre).
# No RetroStick frame yet for the Neo Geo: the overlay stays off.
aspect_ratio_index = "23"
video_scale_integer = "false"
custom_viewport_width = "1440"
custom_viewport_height = "1080"
custom_viewport_x = "0"
custom_viewport_y = "0"
input_overlay_enable = "false"
