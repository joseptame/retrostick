# Content-directory override: games in /ROMs/psx (RetroArch loads config/<Core>/<folder name>.cfg after
# the core's own <Core>.cfg). Installed to /storage/emulated/0/RetroArch/config/PCSX-ReARMed/psx.cfg
# Fixed game size (full height, 4:3), 1440x1080 centred (RetroArch 1.22 centres the custom viewport: x/y are offsets from the centre), inside the RetroStick frame (overlays/retrostick/psx.cfg).
aspect_ratio_index = "23"
video_scale_integer = "false"
custom_viewport_width = "1440"
custom_viewport_height = "1080"
custom_viewport_x = "0"
custom_viewport_y = "0"
input_overlay_enable = "true"
input_overlay = "/storage/emulated/0/RetroArch/overlays/retrostick/psx.cfg"
input_overlay_opacity = "1.000000"
input_overlay_enable_autopreferred = "false"
input_overlay_auto_scale = "false"
input_overlay_auto_rotate = "false"
input_overlay_show_inputs = "0"
input_overlay_hide_in_menu = "true"
input_overlay_hide_when_gamepad_connected = "false"
# Touchpad click (DualSense code 106) shows / hides the frame
input_overlay_next_btn = "106"
